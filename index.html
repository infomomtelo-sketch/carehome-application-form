<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - EC Rental Property Management LLC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --border-color: #dee2e6;
            --background-color: #f8f9fa;
            --text-color: #212529;
            --input-bg: #fff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 14px;
        }

        .invoice-container {
            max-width: 850px;
            margin: 20px auto;
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        .company-details h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
        }
        
        .company-details input {
            border: none;
            background: transparent;
            font-size: 14px;
            padding: 2px 5px;
            width: 250px;
            border-bottom: 1px dashed var(--border-color);
        }
        .company-details input:focus {
             outline: none;
             border-bottom: 1px solid var(--primary-color);
        }

        .invoice-title {
            text-align: right;
        }
        .invoice-title h2 {
            margin: 0;
            font-size: 32px;
            color: var(--secondary-color);
            font-weight: 600;
        }

        .invoice-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            margin-bottom: 40px;
        }
        
        .meta-field {
             display: flex;
             flex-direction: column;
        }

        label {
            font-weight: 600;
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--background-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        td input[type="number"], td input[type="text"] {
            border: none;
            padding: 5px;
            width: 95%;
            background: transparent;
        }
         td input:focus {
            background: #f0f8ff;
            box-shadow: none;
            border-radius: 2px;
         }

        .col-desc { width: 45%; }
        .col-qty, .col-price { width: 15%; }
        .col-total { width: 25%; }
        
        .add-row-btn {
            background: none;
            border: 1px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .add-row-btn:hover {
            background: rgba(13, 110, 253, 0.1);
        }


        .totals-section {
            display: flex;
            justify-content: flex-end;
        }
        .totals-table {
            width: 100%;
            max-width: 300px;
        }
        .totals-table td {
            border: none;
            padding: 8px 15px;
        }
        .totals-table tr td:first-child {
            font-weight: 600;
            text-align: right;
        }
        .totals-table tr.grand-total td {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--primary-color);
        }
        #tax_rate {
            width: 50px;
            text-align: right;
            border: none;
            background: transparent;
        }

        .notes-signature {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid var(--border-color);
        }
        
        .signature-box {
             position: relative;
        }

        canvas {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: crosshair;
            touch-action: none;
        }

        .clear-sig-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--secondary-color);
            cursor: pointer;
            font-size: 12px;
        }
        .clear-sig-btn:hover { color: #dc3545; }
        
        .signature-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ced4da;
            pointer-events: none;
            font-style: italic;
        }

        .actions {
            margin-top: 40px;
            text-align: center;
        }
        .print-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .print-btn:hover {
            background-color: #0b5ed7;
        }

        .footer-credit {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--secondary-color);
        }
        .footer-credit a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .footer-credit a:hover {
            text-decoration: underline;
        }

        .disclaimer {
            font-size: 10px;
            color: #999;
            text-align: center;
            margin-top: 20px;
            padding: 0 20px;
        }

        @media print {
            body {
                background-color: #fff;
                padding: 0;
                font-size: 12px;
            }
            .invoice-container {
                box-shadow: none;
                margin: 0;
                padding: 20px;
                max-width: 100%;
                border: none;
            }
            .actions, .add-row-btn, .clear-sig-btn, .footer-credit, .disclaimer {
                display: none;
            }
            input, textarea {
                border: none !important;
                background: transparent !important;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact;
            }
            .invoice-meta, .notes-signature {
                grid-template-columns: 1fr;
            }
            .signature-box {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="invoice-container">
        <header>
            <div class="company-details">
                <h1>EC Rental Property Management LLC</h1>
                <input type="text" placeholder="123 Property Lane, Anytown, USA 12345">
                <input type="email" placeholder="contact@ecrentalpm.com">
                <input type="tel" placeholder="(555) 123-4567">
            </div>
            <div class="invoice-title">
                <h2>INVOICE</h2>
                <div class="meta-field" style="align-items: flex-end; margin-top: 10px;">
                    <label for="invoice_id">Invoice #</label>
                    <input type="text" id="invoice_id" value="0001" style="width: 100px; text-align: right; border:none; border-bottom: 1px dashed var(--border-color);">
                </div>
            </div>
        </header>

        <main>
            <div class="invoice-meta">
                <div class="billed-to">
                    <label for="client_name">Bill To</label>
                    <input type="text" id="client_name" placeholder="Tenant Full Name">
                    <textarea id="client_address" placeholder="Tenant Address"></textarea>
                </div>
                <div class="meta-details">
                     <div class="meta-field">
                        <label for="invoice_date">Date</label>
                        <input type="date" id="invoice_date">
                    </div>
                     <div class="meta-field">
                        <label for="due_date">Due Date</label>
                        <input type="date" id="due_date">
                    </div>
                </div>
            </div>

            <table id="invoice_items">
                <thead>
                    <tr>
                        <th class="col-desc">Item Description</th>
                        <th class="col-qty">Qty</th>
                        <th class="col-price">Unit Price</th>
                        <th class="col-total">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" placeholder="e.g., Monthly Rent for Property X" value="Monthly Rent"></td>
                        <td><input type="number" class="quantity" value="1" min="0"></td>
                        <td><input type="number" class="price" placeholder="0.00" min="0"></td>
                        <td class="line-total">$0.00</td>
                    </tr>
                    <tr>
                        <td><input type="text" placeholder="e.g., Late Fee"></td>
                        <td><input type="number" class="quantity" value="0" min="0"></td>
                        <td><input type="number" class="price" placeholder="0.00" min="0"></td>
                        <td class="line-total">$0.00</td>
                    </tr>
                </tbody>
            </table>
            
            <button class="add-row-btn" onclick="addRow()">+ Add Item</button>

            <div class="totals-section">
                <table class="totals-table">
                    <tbody>
                        <tr>
                            <td>Subtotal</td>
                            <td id="subtotal">$0.00</td>
                        </tr>
                        <tr>
                            <td>Tax (%) <input type="number" id="tax_rate" value="0" min="0"></td>
                            <td id="tax_amount">$0.00</td>
                        </tr>
                        <tr class="grand-total">
                            <td>Total Due</td>
                            <td id="grand_total">$0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="notes-signature">
                <div class="notes">
                    <label for="notes_text">Notes / Payment Instructions</label>
                    <textarea id="notes_text" placeholder="e.g., Please make payment via Zelle to contact@ecrentalpm.com"></textarea>
                </div>
                <div class="signature-box">
                    <label for="signature_pad">Signature</label>
                    <div class="signature-placeholder">Sign Here</div>
                    <canvas id="signature_pad" width="400" height="150"></canvas>
                    <button class="clear-sig-btn" onclick="clearSignature()">Clear</button>
                </div>
            </div>

        </main>
        
        <div class="actions">
            <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
        </div>

        <p class="disclaimer">This document was generated by Fluentra AI for informational purposes. Consult a licensed attorney for legal advice.</p>
        <p class="footer-credit">Built with <a href='https://fluentra-ai.lovable.app'>Fluentra AI</a></p>
    </div>

    <script>
        // Set today's date
        document.getElementById('invoice_date').valueAsDate = new Date();

        // --- CALCULATION LOGIC ---
        const itemsTable = document.getElementById('invoice_items').querySelector('tbody');
        const taxRateInput = document.getElementById('tax_rate');

        function updateTotals() {
            let subtotal = 0;
            itemsTable.querySelectorAll('tr').forEach(row => {
                const quantity = parseFloat(row.querySelector('.quantity').value) || 0;
                const price = parseFloat(row.querySelector('.price').value) || 0;
                const lineTotal = quantity * price;
                row.querySelector('.line-total').textContent = '$' + lineTotal.toFixed(2);
                subtotal += lineTotal;
            });

            const taxRate = parseFloat(taxRateInput.value) || 0;
            const taxAmount = subtotal * (taxRate / 100);
            const grandTotal = subtotal + taxAmount;

            document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('tax_amount').textContent = '$' + taxAmount.toFixed(2);
            document.getElementById('grand_total').textContent = '$' + grandTotal.toFixed(2);
        }

        function addRow() {
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td><input type="text" placeholder="New Item"></td>
                <td><input type="number" class="quantity" value="1" min="0"></td>
                <td><input type="number" class="price" placeholder="0.00" min="0"></td>
                <td class="line-total">$0.00</td>
            `;
            itemsTable.appendChild(newRow);
            attachRowListeners(newRow);
            updateTotals();
        }

        function attachRowListeners(row) {
             row.querySelectorAll('.quantity, .price').forEach(input => {
                input.addEventListener('input', updateTotals);
            });
        }
        
        itemsTable.querySelectorAll('tr').forEach(attachRowListeners);
        taxRateInput.addEventListener('input', updateTotals);
        
        // --- SIGNATURE PAD LOGIC ---
        const canvas = document.getElementById('signature_pad');
        const placeholder = document.querySelector('.signature-placeholder');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }
        function getTouchPos(canvas, touch) {
             const rect = canvas.getBoundingClientRect();
             return {
                 x: touch.clientX - rect.left,
                 y: touch.clientY - rect.top
             };
        }

        function startDrawing(e) {
            isDrawing = true;
            placeholder.style.display = 'none';
            const pos = e.type.includes('touch') ? getTouchPos(canvas, e.touches[0]) : getMousePos(canvas, e);
            [lastX, lastY] = [pos.x, pos.y];
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = e.type.includes('touch') ? getTouchPos(canvas, e.touches[0]) : getMousePos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
            e.preventDefault();
        }
        
        function stopDrawing(e) {
            isDrawing = false;
            e.preventDefault();
        }
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            placeholder.style.display = 'block';
        }

        // Initialize calculations on load
        window.onload = updateTotals;
    </script>
</body>
</html>
